name: Apply Supabase migrations

# Pushes the SQL in `supabase/migrations/` to the production Supabase project.
# Kept separate from the Pages deploy on purpose: applying schema to a live
# database is higher-stakes than shipping static assets, so it runs only when a
# migration file actually changes on `main` (or on demand), not on every deploy.
#
# Our migrations are forward-only and written to be safe to re-run
# (`create table if not exists`, `create or replace function`, `add column if
# not exists`, `drop policy if exists`), and the current changes are
# backward-compatible (protocol v2 is additive), so a re-run is a no-op.
#
# Required repo config (Settings → Secrets and variables → Actions):
#   Variables: SUPABASE_PROJECT_REF  (the project ref, e.g. abcd1234… — not secret)
#   Secrets:   SUPABASE_ACCESS_TOKEN (a personal access token from the Supabase dashboard)
#              SUPABASE_DB_PASSWORD  (the project's database password)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

# Never run two pushes against the same database at once.
concurrency:
  group: supabase-db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    # Forks don't hold the secrets and must not push to our database. The check
    # also means a fork's own run simply no-ops instead of failing.
    if: ${{ github.repository == 'RedbackThomson/Scrolled' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push
