name: Apply Supabase migrations

# Pushes the SQL in `supabase/migrations/` to the production Supabase project.
# Kept separate from the Pages deploy on purpose: applying schema to a live
# database is higher-stakes than shipping static assets, so it runs only when a
# migration file actually changes on `main` (or on demand), not on every deploy.
#
# Our migrations are forward-only and written to be safe to re-run
# (`create table if not exists`, `create or replace function`, `add column if
# not exists`, `drop policy if exists`), and the current changes are
# backward-compatible (protocol v2 is additive), so a re-run is a no-op.
#
# Required repo config (Settings → Secrets and variables → Actions):
#   Variables: SUPABASE_PROJECT_REF  (the project ref, e.g. abcd1234… — not secret)
#              DOWNSTREAM_APP_CLIENT_ID (client ID of the GitHub App below)
#   Secrets:   SUPABASE_ACCESS_TOKEN (a personal access token from the Supabase dashboard)
#              SUPABASE_DB_PASSWORD  (the project's database password)
#              DOWNSTREAM_APP_PRIVATE_KEY (private key of a GitHub App with
#                                     Contents read/write, installed on each
#                                     downstream deployment repo)
#
# Every repo the App is installed on is told when migrations change, so private
# deployment repos are never named here. GITHUB_TOKEN can't trigger workflows in
# another repo, hence the App.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

# Never run two pushes against the same database at once.
concurrency:
  group: supabase-db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-24.04
    # Forks don't hold the secrets and must not push to our database. The check
    # also means a fork's own run simply no-ops instead of failing.
    if: ${{ github.repository == 'RedbackThomson/Scrolled' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push

      # Runs after our own push so a migration that fails here never reaches
      # a downstream database.
      - name: Get downstream App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOWNSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_APP_PRIVATE_KEY }}
          # Without `repositories`, the token covers every repo the App is
          # installed on under this owner.
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Notify downstream deployments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          repos=$(gh api --paginate installation/repositories --jq '.repositories[].full_name')
          # Public logs: hide the private repo names before anything can print them.
          for repo in $repos; do echo "::add-mask::$repo"; done
          for repo in $repos; do
            gh api "repos/$repo/dispatches" \
              -f event_type=migrations-updated -f "client_payload[ref]=$GITHUB_SHA"
          done
