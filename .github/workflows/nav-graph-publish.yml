name: Publish @scrolled/nav-graph

# Publishes packages/nav-graph to npm on every push to main. Two modes,
# selected automatically by comparing package.json's version to npm:
#
#   - Novel version (not yet on npm)     → publish to `latest` tag (a release)
#   - Version already on npm             → publish `<version>-dev.<sha7>` to
#                                          the `dev` tag (a rolling preview
#                                          you can pull with `@dev` or by
#                                          full version string)
#
# Iterate fast: push anything, get a fresh dev build under the same base
# version. Cut a stable release: bump version in package.json, push.
#
# Authentication: npm Trusted Publishers (OIDC) — no NPM_TOKEN secret needed.
# The `id-token: write` permission below + GitHub's
# ACTIONS_ID_TOKEN_REQUEST_* env vars let `npm publish --provenance`
# authenticate against npm directly. See README.md → "Releasing to npm".

on:
  push:
    branches: [main]
    paths:
      - 'packages/nav-graph/**'
      - '.github/workflows/nav-graph-publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + pack only, do not publish'
        type: boolean
        default: true

concurrency:
  group: nav-graph-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for npm OIDC + provenance

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes a .npmrc with the public registry so `npm publish` knows
          # where to go. No auth token is written — OIDC supplies the creds.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to an OIDC-capable version
        # Node 20 LTS bundles npm 10.x, which has no Trusted Publisher / OIDC
        # exchange. npm 11.5.1+ is required for `--provenance` to authenticate
        # via the GitHub OIDC token instead of an NPM_TOKEN. Without this,
        # `npm publish` falls back to no-auth and the registry returns 404.
        run: npm install --global npm@latest

      - name: Decide release vs dev publish
        id: target
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./packages/nav-graph/package.json').version")
          sha7=$(echo "${{ github.sha }}" | cut -c1-7)

          # `npm view <name>@<exact>` prints the version and exits 0 if it
          # exists, returns E404 if not. Treat anything else as a real error.
          if out=$(npm view "@scrolled/nav-graph@$pkg_version" version 2>&1); then
            if [ -n "$out" ]; then
              dev_version="${pkg_version}-dev.${sha7}"
              echo "publish_version=$dev_version" >> "$GITHUB_OUTPUT"
              echo "dist_tag=dev" >> "$GITHUB_OUTPUT"
              echo "mode=dev" >> "$GITHUB_OUTPUT"
              echo "::notice::Base $pkg_version is on npm. Publishing $dev_version to @dev."
            fi
          else
            if echo "$out" | grep -q 'E404'; then
              echo "publish_version=$pkg_version" >> "$GITHUB_OUTPUT"
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              echo "mode=release" >> "$GITHUB_OUTPUT"
              echo "::notice::Publishing $pkg_version to @latest."
            else
              echo "::error::npm view failed: $out"
              exit 1
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @scrolled/nav-graph typecheck

      - name: Test
        run: pnpm --filter @scrolled/nav-graph test

      - name: Stamp dev version into package.json
        if: steps.target.outputs.mode == 'dev'
        env:
          DEV_VERSION: ${{ steps.target.outputs.publish_version }}
        # The mutation is ephemeral — never committed. Provenance still ties
        # the publish to this exact commit SHA via the OIDC token.
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'packages/nav-graph/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.DEV_VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        run: pnpm --filter @scrolled/nav-graph build

      - name: Stage LICENSE
        run: cp LICENSE packages/nav-graph/LICENSE

      - name: Pack tarball preview
        working-directory: packages/nav-graph
        run: pnpm pack --pack-destination .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolled-nav-graph-${{ steps.target.outputs.publish_version }}-tarball
          path: packages/nav-graph/scrolled-nav-graph-*.tgz
          if-no-files-found: error

      - name: Publish to npm (OIDC + provenance)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/nav-graph
        # npm CLI picks up the OIDC token from these env vars and exchanges it
        # against the configured Trusted Publisher on npm. --provenance is
        # required for the OIDC flow and also publishes the Sigstore-signed
        # provenance attestation that shows on the package page.
        #
        # --ignore-scripts skips prepublishOnly (typecheck/test/clean/build/
        # LICENSE copy) — we already did all of that in explicit CI steps,
        # and the dist + LICENSE staged above is what we want to ship as-is.
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          npm publish \
            --access public \
            --provenance \
            --tag ${{ steps.target.outputs.dist_tag }} \
            --ignore-scripts
